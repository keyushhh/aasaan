.sheet h3{font-size:27px}
.login h1{font-size:42px}
.seg button{font-family:var(--display);font-size:17px}
.seg button.on{background:var(--yel);color:var(--yel-ink)}
.search,.field input,.field select{border-width:2px}
.banner{border-left:6px solid var(--yel)}

:root{--btn-fill:var(--yel);--btn-ink:var(--yel-ink)}
.sg-head{padding:14px 18px 26px;position:relative;overflow:hidden}
.sg-head::after{content:"";position:absolute;left:18px;right:18px;bottom:12px;height:4px;background:repeating-linear-gradient(90deg,var(--yel) 0 22px,transparent 22px 36px);opacity:.9}
.sg-brand{font-size:22px}
.sg-date{margin-left:auto;font-family:var(--font);font-size:14px;font-weight:600;opacity:.85}
.sg-count{margin:22px 0 6px;font-weight:inherit}
.sg-num{overflow:hidden}
.sg-head.enter .sg-num{animation:numIn .7s var(--ease-enter) both}
.sg-head.enter .sg-lbl{animation:rise .55s var(--ease-enter) .22s both}
.sg-head.enter::after{animation:lane .9s var(--ease-enter) .2s both}
@keyframes numIn{from{transform:translateY(35%);opacity:0}}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
@keyframes lane{from{clip-path:inset(0 100% 0 0)}}
.sg-alert{min-height:76px}
.sg-alert:not(:first-of-type) .sg-go{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--line)}
.sg-tile{transition-property:transform,box-shadow}
.sg-tile svg{opacity:.95}
.top{box-shadow:0 1px 0 rgba(0,0,0,.08)}
.sync{display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.banner + .sync::before{background:var(--yel)}
.row-t{font-family:var(--font);font-weight:600}
.list .row{min-height:60px}
.kv dd .pill{transform:none}
.hero .kv{margin-top:16px}
.code{font-size:42px;border-color:var(--sign);color:var(--accent)}
.switch[aria-checked="true"]{background:var(--sign)}
.switch.warn[aria-checked="true"]{background:var(--yel)}
.sheet-title{font-size:28px}
.success .ring{background:var(--ok);color:#fff}
.tl .done .dot{background:var(--ok)}
.tl .current .dot{border-color:var(--yel);background:var(--yel);box-shadow:0 0 0 4px var(--hi-soft)}
.toast{font-weight:600}
.login{padding-top:32px}
.login .logo{background:var(--yel);color:var(--yel-ink);border-radius:12px}
.login h1{max-width:12ch}

</style>

<body>
<!-- Aasaan v2, design B (Signal). Independent design prototype: sample data only, no real government APIs connected. -->
<div id="app"></div>
<script>

(function(){
const $=s=>document.querySelector(s);
const app=$('#app');
const VAR='signal';
const KEY='aasaan-signal-v2';
const DAY=86400000, MIN=60000;

const inr=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);
const fd=d=>new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const fts=ts=>new Date(ts).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const daysTo=d=>{const a=new Date(d+'T00:00:00'),b=new Date(todayISO()+'T00:00:00');return Math.round((a-b)/DAY)};
const ago=ts=>{const m=Math.round((Date.now()-ts)/MIN);if(m<1)return 'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+(h===1?' hour ago':' hours ago');const d=Math.round(h/24);return d+(d===1?' day ago':' days ago')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(n,chars='0123456789')=>Array.from({length:n},()=>chars[Math.floor(Math.random()*chars.length)]).join('');

const I={
  wallet:'<path d="M3 7a2 2 0 0 1 2-2h12v4"/><path d="M3 7v10a2 2 0 0 0 2 2h14V9H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="14" r="1.2"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  car:'<path d="M4 13l2-5a2 2 0 0 1 1.9-1.3h8.2A2 2 0 0 1 18 8l2 5v4H4z"/><path d="M6 17v2M18 17v2"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/>',
  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/>',
  grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  chev:'<path d="M9 5l7 7-7 7"/>',
  alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  share:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11l7.6-3.8M8.2 13l7.6 3.8"/>',
  download:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  shield:'<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/>',
  clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'
};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

const SVC={
  epf:{name:'Provident Fund',hi:'पीएफ़ (भविष्य निधि)',dept:'EPFO',icon:'wallet'},
  docs:{name:'Documents',hi:'दस्तावेज़',dept:'DigiLocker',icon:'folder'},
  vehicle:{name:'Vehicle and licence',hi:'वाहन और लाइसेंस',dept:'Parivahan',icon:'car'},
  tax:{name:'Income tax',hi:'आयकर',dept:'Income Tax Department',icon:'receipt'},
  health:{name:'Health ID',hi:'स्वास्थ्य आईडी',dept:'ABDM',icon:'heart'}
};
const KEYS=Object.keys(SVC);

const T={
  en:{home:'Home',services:'Services',requests:'Requests',profile:'Profile',hello:'Namaste',tagline:'Your government services, in one place',attention:'Needs your attention',yourServices:'Your services',recent:'Recent activity',search:'Try “pay challan” or “PF balance”',allClear:'All clear. Nothing needs you right now.'},
  hi:{home:'होम',services:'सेवाएँ',requests:'अनुरोध',profile:'प्रोफ़ाइल',hello:'नमस्ते',tagline:'आपकी सरकारी सेवाएँ, एक जगह',attention:'आपके ध्यान के लिए',yourServices:'आपकी सेवाएँ',recent:'हाल की गतिविधि',search:'खोजें, जैसे “चालान” या “पीएफ़ बैलेंस”',allClear:'सब ठीक है। अभी कुछ करना नहीं है।'}
};

const EPF={uan:'1012 3456 7890',org:'Brightline Technologies Pvt Ltd',employee:342180,employer:296540,eps:112400,
  book:[['Oct 2026'],['Sep 2026'],['Aug 2026'],['Jul 2026'],['Jun 2026'],['May 2026']].map(([m])=>({m,a:7200,b:5950,c:1250}))};
const ELIG=Math.round(EPF.employee*0.5);
const PUC='2026-12-02', INS='2027-03-21';

const DOCS=[
  {id:'aadhaar',name:'Aadhaar',issuer:'UIDAI',no:'XXXX XXXX 4821',issued:'2014-06-11',fields:[['Name','Ananya Rao'],['Year of birth','1994'],['Address','Indiranagar, Bengaluru']]},
  {id:'pan',name:'PAN card',issuer:'Income Tax Department',no:'ABCPR••••K',issued:'2012-03-02',fields:[['Name','Ananya Rao'],['Father’s name','Suresh Rao'],['Date of birth','14 Aug 1994']]},
  {id:'dl',name:'Driving licence',issuer:'Transport Department, Karnataka',no:'KA01 20190012345',issued:'2019-01-22',fields:[['Class','LMV, MCWG'],['Valid till','13 Aug 2039'],['RTO','Bengaluru Central']]},
  {id:'rc',name:'Vehicle RC',issuer:'Transport Department, Karnataka',no:'KA 01 MJ 4521',issued:'2019-03-14',fields:[['Vehicle','Maruti Suzuki Swift VXi'],['Fuel','Petrol'],['Owner','Ananya Rao']]},
  {id:'xii',name:'Class XII marksheet',issuer:'CBSE',no:'Roll 9142873',issued:'2012-05-28',fields:[['Year','2012'],['Result','Pass, 88.4%']]},
  {id:'abha',name:'ABHA card',issuer:'National Health Authority',no:'91-4821-7735-0062',issued:'2023-02-09',fields:[['ABHA address','ananya.rao@abdm'],['Name','Ananya Rao']]}
];
const RECORDS=[['Complete blood count','City Diagnostics','2026-09-12'],['Prescription','Sanjeevani Clinic','2026-09-14'],['Vaccination record','Urban PHC, Indiranagar','2025-11-03']];

function seed(loggedIn){
  const n=Date.now();
  return {loggedIn:!!loggedIn,lang:'en',mobile:'',name:'Ananya Rao',
    linked:{epf:true,docs:true,vehicle:true,tax:true,health:true},
    outage:{epf:false,docs:false,vehicle:false,tax:false,health:false},
    sync:{epf:n-25*MIN,docs:n-130*MIN,vehicle:n-9*MIN,tax:n-26*60*MIN,health:n-42*MIN},
    challans:[
      {id:'c1',no:'KA03926100811',offence:'Parking in a no-parking zone',place:'100 Feet Road, Indiranagar',date:'2026-10-08',amount:500,paid:false},
      {id:'c2',no:'KA03925051204',offence:'Jumping a red signal',place:'Silk Board Junction',date:'2025-05-12',amount:1000,paid:true,paidOn:'2025-05-14'}
    ],
    requests:[
      {id:'r1',svc:'epf',title:'PF withdrawal for housing',ref:'EPF/KA/26/118042',amount:85000,created:'2026-11-03',status:'active',steps:[
        {l:'Submitted to EPFO',d:'2026-11-03',st:'done'},{l:'Verified by employer',d:'2026-11-05',st:'done'},
        {l:'EPFO review',d:'',st:'current',n:'Usually 5 to 7 working days'},{l:'Paid to HDFC Bank ••4417',d:'',st:'todo'}]},
      {id:'r2',svc:'tax',title:'Income tax refund, AY 2026-27',ref:'Acknowledgement 482917306241026',amount:14230,created:'2026-07-24',status:'done',steps:[
        {l:'Return filed',d:'2026-07-24',st:'done'},{l:'Return processed',d:'2026-09-19',st:'done'},
        {l:'Refund issued',d:'2026-10-26',st:'done'},{l:'Credited to SBI ••0932',d:'2026-10-28',st:'done'}]},
      {id:'r3',svc:'vehicle',title:'Challan paid for red signal',ref:'KA03925051204',amount:1000,created:'2025-05-14',status:'done',steps:[
        {l:'Payment received',d:'2025-05-14',st:'done'},{l:'Challan closed',d:'2025-05-14',st:'done'}]}
    ],
    consents:[{id:'k1',from:'City Care Hospital, Bengaluru',purpose:'a doctor consultation',what:'lab reports and prescriptions from the last 12 months',until:'7 days',status:'pending'}],
    shares:[]};
}
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.linked)S=seed(false);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const t=k=>(T[S.lang]||T.en)[k]||T.en[k];
const sname=k=>S.lang==='hi'?SVC[k].hi:SVC[k].name;

/* ---------- shared bits ---------- */
const V={home:vHome,services:vServices,requests:vRequests,profile:vProfile,epf:vEpf,docs:vDocs,vehicle:vVehicle,tax:vTax,health:vHealth};
const cur=()=>{const h=location.hash.slice(1);return V[h]?h:'home'};
let entered=false, pendingQ='', lastRoute=null, nav=0, step='mobile', tmpMobile='', shareExp=24;

function top(title){return `<header class="top"><h1>${title}</h1></header>`}
function topSvc(k){
  return `<header class="top"><button class="icon-btn" data-a="back" aria-label="Back">${ic('back',20)}</button><h1>${sname(k)}<span class="dept">${SVC[k].dept}</span></h1>${S.linked[k]?`<button class="icon-btn" data-a="refresh" data-k="${k}" aria-label="Refresh from ${SVC[k].dept}">${ic('refresh',19)}</button>`:''}</header>`;
}
function svcView(k,body){
  let h=topSvc(k)+'<main class="pad" id="main">';
  if(!S.linked[k]){
    return h+`<div class="card"><div class="att-ic" data-svc="${k}" style="margin-bottom:12px">${ic(SVC[k].icon)}</div><div class="row-t">Link your ${SVC[k].dept} account</div><p class="row-s">You’ll give consent once. Aasaan fetches your records only when you open this screen, and you can unlink any time.</p><button class="btn primary block" data-a="link" data-k="${k}">Link ${SVC[k].dept}</button></div></main>`;
  }
  if(S.outage[k])h+=`<div class="banner">${ic('alert',20)}<div><b>${SVC[k].dept} isn’t responding right now</b>You’re seeing your last synced data. We’ll keep retrying in the background.</div></div>`;
  h+=`<div class="sync">Last updated ${ago(S.sync[k])} from ${SVC[k].dept}</div>`;
  return h+body+'</main>';
}
function skeleton(){
  const b=w=>`<div class="skel" style="width:${w}"></div>`;
  return `<div class="card hero">${b('35%')}<div class="skel" style="width:65%;height:30px;margin:14px 0"></div>${b('90%')}</div><div class="card" style="margin-top:12px;display:grid;gap:12px">${b('80%')}${b('60%')}${b('70%')}</div>`;
}
const pillFor=r=>r.status==='done'?'<span class="pill ok">Completed</span>':r.status==='queued'?'<span class="pill warn">Queued</span>':'<span class="pill info">In progress</span>';
const curStep=r=>(r.steps.find(s=>s.st==='current')||r.steps[r.steps.length-1]).l;
function reqRow(r){
  return `<button class="row" data-a="openReq" data-id="${r.id}"><span class="att-ic" data-svc="${r.svc}">${ic(SVC[r.svc].icon,18)}</span><span class="row-b"><span class="row-t">${esc(r.title)}</span><span class="row-s">${esc(curStep(r))}</span></span>${pillFor(r)}</button>`;
}
function timeline(r){
  return `<ol class="tl">${r.steps.map(s=>`<li class="${s.st}"><span class="dot"></span><span class="row-t">${esc(s.l)}</span><span class="row-s">${s.d?fd(s.d):(s.n||(s.st==='current'?'In progress':'Not started'))}</span></li>`).join('')}</ol>`;
}
function validity(days,date){
  if(days<0)return `<span class="pill danger">Expired ${fd(date)}</span>`;
  if(days<=30)return `<span class="pill warn">Expires in ${days} day${days===1?'':'s'}</span>`;
  return `<span class="pill ok">Valid till ${fd(date)}</span>`;
}

/* ---------- home ---------- */
function attention(){
  const a=[];
  S.challans.filter(c=>!c.paid).forEach(c=>a.push({svc:'vehicle',tone:'danger',icon:'alert',title:`Unpaid traffic challan of ${inr(c.amount)}`,body:`${c.offence}, ${fd(c.date)}`,cta:'Pay challan',act:`data-a="pay" data-id="${c.id}"`}));
  const p=daysTo(PUC);
  if(p<=30)a.push({svc:'vehicle',tone:'warn',icon:'clock',title:p<0?'Your PUC certificate has expired':`Your PUC certificate expires in ${p} day${p===1?'':'s'}`,body:'KA 01 MJ 4521. Renew at any PUC centre to avoid a fine.',cta:'View PUC details',act:'data-a="go" data-r="vehicle"'});
  S.consents.filter(c=>c.status==='pending').forEach(c=>a.push({svc:'health',tone:'info',icon:'shield',title:`${c.from} wants to see your records`,body:`For ${c.purpose}. Nothing is shared until you allow it.`,cta:'Review request',act:'data-a="go" data-r="health"'}));
  S.requests.filter(r=>r.status!=='done').forEach(r=>a.push({svc:r.svc,tone:r.status==='queued'?'warn':'info',icon:SVC[r.svc].icon,title:r.title,body:`Now: ${curStep(r)}`,cta:`Track ${r.svc==='epf'?'claim':'request'}`,act:`data-a="openReq" data-id="${r.id}"`}));
  KEYS.filter(k=>S.outage[k]&&S.linked[k]).forEach(k=>a.push({svc:k,tone:'warn',icon:'alert',title:`${SVC[k].dept} is down right now`,body:'Your last synced data is still here. Anything you submit is queued and sent when it’s back.',cta:`Open ${SVC[k].dept}`,act:`data-a="go" data-r="${k}"`}));
  return a;
}
const svcState=k=>!S.linked[k]?'Not linked':S.outage[k]?SVC[k].dept+' is down':SVC[k].dept;
function vHome(){
  const att=attention(), first=esc(S.name.split(' ')[0]);
  const recent=`<h2 class="h">${t('recent')}</h2><div class="card list">${S.requests.slice(0,3).map(reqRow).join('')}</div>`;
  if(VAR==='signal'){
    const enter=entered?'':' enter';entered=true;
    const date=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
    return `<header class="sg-head${enter}"><div class="sg-brand"><span class="logo" aria-hidden="true">आ</span><span>Aasaan</span><span class="sg-date">${date}</span></div>
    <h1 class="sg-count"><span class="sg-num">${att.length}</span><span class="sg-lbl">${att.length===1?'thing needs':'things need'} you today, ${first}</span></h1></header>
    <main class="pad" id="main">
    ${att.map(x=>`<button class="sg-alert ${x.tone}" ${x.act}><span class="sg-alert-ic">${ic(x.icon,26)}</span><span class="att-b"><span class="att-t">${esc(x.title)}</span><span class="att-s">${esc(x.body)}</span></span><span class="sg-go">${x.cta}</span></button>`).join('')}
    <h2 class="h">${t('yourServices')}</h2>
    <div class="sg-tiles">${KEYS.map(k=>`<button class="sg-tile" data-svc="${k}" data-a="go" data-r="${k}">${ic(SVC[k].icon,30)}<span class="sg-tn">${sname(k)}</span><span class="sg-td">${svcState(k)}</span></button>`).join('')}</div>
    ${recent}</main>`;
  }
  if(VAR==='saathi'){
    return `<header class="top"><div class="brand"><span class="logo" aria-hidden="true">आ</span><div><div class="hello">${t('hello')}, ${first}</div><div class="sub">${att.length?`${att.length} update${att.length===1?'':'s'} waiting for you`:t('allClear')}</div></div></div></header>
    <main class="pad" id="main">
    <label class="st-ask">${ic('search',20)}<input id="ask" type="search" enterkeyhint="search" placeholder="What do you need to do?" aria-label="Search services"></label>
    <div class="st-chips">${KEYS.map(k=>`<button class="st-chip" data-a="go" data-r="${k}"><span class="st-av" data-svc="${k}">${ic(SVC[k].icon,18)}</span>${sname(k)}</button>`).join('')}</div>
    ${att.length?`<h2 class="h">${t('attention')}</h2><div class="st-feed">${att.map(x=>`<div class="st-msg"><span class="st-av" data-svc="${x.svc}">${ic(x.icon,18)}</span><div class="st-bub ${x.tone}"><div class="st-from">${SVC[x.svc].dept}</div><div class="att-t">${esc(x.title)}</div><div class="att-s">${esc(x.body)}</div><button class="chip-btn" ${x.act}>${x.cta}</button></div></div>`).join('')}</div>`:''}
    ${recent}</main>`;
  }
  const date=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return `<header class="top"><div class="brand"><span class="logo" aria-hidden="true">आ</span><div><div class="hello">Aasaan</div><div class="sub">${date}</div></div></div></header>
  <main class="pad" id="main">
  <p class="lg-greet">${t('hello')}, ${first}. ${att.length?`There ${att.length===1?'is one entry':'are '+att.length+' entries'} on today’s file.`:t('allClear')}</p>
  ${att.length?`<section class="lg-file" aria-label="${t('attention')}">${att.map(x=>`<div class="lg-entry ${x.tone}"><span class="lg-seal">${ic(x.icon,18)}</span><div class="att-b"><span class="att-t">${esc(x.title)}</span><span class="att-s">${esc(x.body)}</span><button class="lg-link" ${x.act}>${x.cta}</button></div></div>`).join('')}</section>`:''}
  <h2 class="h">${t('yourServices')}</h2>
  <div class="grid">${KEYS.map(k=>`<button class="tile" data-a="go" data-r="${k}"><span class="tile-ic">${ic(SVC[k].icon,24)}</span><span><span class="tile-n">${sname(k)}</span><span class="tile-d ${S.outage[k]?'down':''}">${svcState(k)}</span></span></button>`).join('')}</div>
  ${recent}</main>`;
}

  ['Check PF balance','epf','pf epf balance provident पीएफ़ बैलेंस'],['Withdraw from PF','epf','claim withdraw advance pf निकासी'],['PF passbook','epf','passbook contribution पासबुक'],

/* ---------- sheet + toast ---------- */
function openSheet(html){
  closeSheet();
  const w=document.createElement('div');w.className='sheet-wrap';w.id='sheetWrap';
  w.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  w.addEventListener('click',e=>{if(e.target===w)closeSheet()});
  document.body.appendChild(w);document.body.style.overflow='hidden';
}
function setSheet(html){const s=document.querySelector('#sheetWrap .sheet');if(s)s.innerHTML='<div class="grab"></div>'+html}
function closeSheet(){const w=$('#sheetWrap');if(w)w.remove();document.body.style.overflow=''}
let tt;
function toast(m){
  let el=$('#toast');
  if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=m;el.style.display='block';clearTimeout(tt);tt=setTimeout(()=>{el.style.display='none'},3000);
}

/* ---------- actions ---------- */
const A={
  go:d=>{nav++;if(cur()===d.r){closeSheet();render()}else location.hash=d.r},
  tab:d=>{nav=0;if(cur()===d.r){window.scrollTo(0,0)}else location.hash=d.r},
  back:()=>{if(nav>0){nav--;history.back()}else location.hash='home'},
  close:()=>closeSheet(),
  skip:()=>{const m=$('#main');if(m){m.setAttribute('tabindex','-1');m.focus()}},
  sendOtp:()=>{const v=($('#mob').value||'').replace(/\D/g,'');if(!/^[6-9]\d{9}$/.test(v)){$('#err').textContent='Enter a valid 10-digit mobile number.';return}tmpMobile=v;step='otp';paintLogin()},
  verifyOtp:()=>{if(($('#otp').value||'').trim()!=='123456'){$('#err').textContent='That OTP doesn’t match. In this demo, use 123456.';return}step='link';paintLogin()},
  changeNum:()=>{step='mobile';paintLogin()},
  finishLink:()=>{document.querySelectorAll('.check-row input').forEach(i=>{S.linked[i.dataset.k]=i.checked});S.mobile=tmpMobile;S.loggedIn=true;step='mobile';save();lastRoute=null;if(cur()==='home')route();else location.hash='home'},
  refresh:(d,el)=>{const k=d.k;el.classList.add('spin');setTimeout(()=>{el.classList.remove('spin');if(S.outage[k]){toast(`Still can’t reach ${SVC[k].dept}. We’ll keep retrying.`);return}S.sync[k]=Date.now();save();render();toast(`Updated from ${SVC[k].dept}`)},700)},
  claim:()=>openClaim(),
  submitClaim:()=>submitClaim(),
  doc:d=>openDoc(d.id),
  share:d=>openShare(d.id),
  exp:(d,el)=>{shareExp=+d.v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el))},
  makeCode:d=>makeCode(d.id),
  copy:d=>{try{navigator.clipboard.writeText(d.v).then(()=>toast('Code copied')).catch(()=>toast('Copying isn’t available here. Note the code down.'))}catch(e){toast('Copying isn’t available here. Note the code down.')}},
  revoke:d=>{S.shares=S.shares.filter(s=>s.id!==d.id);save();render();toast('Code revoked. It no longer works.')},
  dl:()=>toast('In the live app, this saves a verified PDF to your phone.'),
  pay:d=>openPay(d.id),
  confirmPay:(d,el)=>confirmPay(d.id,el),
  consent:d=>{if(S.outage.health){toast('ABDM isn’t responding, so your choice can’t be sent yet. Try again shortly.');return}const c=S.consents.find(x=>x.id===d.id);c.status=d.v;save();render();toast(d.v==='allowed'?`Access allowed for ${c.until}`:'Request denied. Nothing was shared.')},
  openReq:d=>openReq(d.id),
  lang:d=>{S.lang=d.v;save();document.documentElement.lang=d.v;render()},
  link:d=>{const k=d.k;S.linked[k]=!S.linked[k];if(S.linked[k]){S.sync[k]=Date.now();lastRoute=null}save();if(SVC[cur()]&&S.linked[k])route();else render();toast(S.linked[k]?`${SVC[k].dept} linked`:`${SVC[k].dept} unlinked. Aasaan deleted its copy of this data.`)},
  outage:d=>{
    const k=d.k;S.outage[k]=!S.outage[k];
    if(!S.outage[k]){
      const q=S.requests.filter(r=>r.svc===k&&r.status==='queued'),dd=todayISO();
      q.forEach(r=>{const i=r.steps.findIndex(s=>s.st==='current');if(i>-1){r.steps[i].st='done';r.steps[i].d=dd;if(r.steps[i+1]){r.steps[i+1].st='current';r.steps[i+1].n='Usually 2 to 3 working days'}}r.status='active';r.ref='EPF/KA/26/'+rnd(6)});
      S.sync[k]=Date.now();save();render();
      toast(q.length?`${SVC[k].dept} is back. ${q.length} queued request${q.length>1?'s were':' was'} submitted.`:`${SVC[k].dept} is back online`);
    }else{save();render();toast(`Simulating ${SVC[k].dept} outage`)}
  },
  reset:()=>{const m=S.mobile,l=S.lang;S=seed(true);S.mobile=m;S.lang=l;save();lastRoute=null;toast('Sample data reset');if(cur()==='home')route();else location.hash='home'},
  logout:()=>{S.loggedIn=false;step='mobile';save();location.hash='home';paintLogin()}
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}
});
document.addEventListener('input',e=>{if(e.target.id==='q')renderResults(e.target.value)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if(e.key==='Enter'){if(e.target.id==='ask'){pendingQ=e.target.value.trim();nav++;location.hash='services'}else if(e.target.id==='mob')A.sendOtp();else if(e.target.id==='otp')A.verifyOtp();else if(e.target.id==='cAmt')submitClaim()}
});
window.addEventListener('hashchange',route);
route();
})();

</script>
</body>
</html>
